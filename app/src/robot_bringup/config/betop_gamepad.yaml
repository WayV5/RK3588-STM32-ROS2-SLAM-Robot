# Betop Asura SE (北通阿修罗SE) gamepad config for teleop_twist_joy
#
# Controller mode: X (Xbox 360) — press HOME to cycle, X LED lit
#
# Startup (PC):
#   ros2 run joy joy_node --ros-args -p dev:="/dev/input/js1" \
#     -p autorepeat_rate:=100.0 -p coalesce_interval:=0.005
#   ros2 run teleop_twist_joy teleop_node \
#     --ros-args --params-file $(ros2 pkg prefix robot_bringup)/share/robot_bringup/config/betop_gamepad.yaml

teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.5
    scale_linear_turbo:
      x: 1.0

    axis_angular:
      yaw: 3
    scale_angular:
      yaw: 1.5
    scale_angular_turbo:
      yaw: 2.0

    enable_button: 5
    enable_turbo_button: 4
    require_enable_button: true
