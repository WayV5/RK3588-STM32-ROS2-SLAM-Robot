amcl:
  ros__parameters:
    use_sim_time: false
    # Motion model noise (differential drive)
    alpha1: 0.2     # rotation noise from rotation
    alpha2: 0.2     # rotation noise from translation
    alpha3: 0.2     # translation noise from translation
    alpha4: 0.2     # translation noise from rotation
    alpha5: 0.2     # extra noise (unused in diff model)
    base_frame_id: base_footprint
    # Laser model: likelihood_field (best for RPLIDAR)
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 1.0    # tight: only nearby particles score high (was 2.0)
    laser_max_range: 4.0
    laser_min_range: 0.2
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 5000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.01
    pf_z: 0.99
    # ★ Kidnapping recovery: inject random particles when scan mismatches
    recovery_alpha_fast: 0.5      # aggressive re-localize (was 0.1→0.3)
    recovery_alpha_slow: 0.01     # gradual injection (was 0.001)
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.1                # tight match required (was 0.2)
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1             # update even on small rotation (was 0.2)
    update_min_d: 0.1             # update even on small translation (was 0.15)
    # Sensor model weights
    z_hit: 0.6                    # weight laser hits more (was 0.5)
    z_max: 0.05
    z_rand: 0.3                   # less random noise (was 0.5)
    z_short: 0.05
    scan_topic: /scan
    # Two-phase: startup from origin, kidnapping auto-recovery
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Use same BT for both to avoid through_poses extra plugin requirements
    # ★ 替换默认BT: PipelineSequence+RateController导致ComputePathToPose永远RUNNING,
    #    FollowPath永远不被tick → cmd_vel 0Hz. 改用简单Sequence
    default_nav_to_pose_bt_xml: /app/src/robot_bringup/config/behavior_tree/navigate_simple.xml
    default_nav_through_poses_bt_xml: /app/src/robot_bringup/config/behavior_tree/navigate_simple.xml
    # Humble default 22 plugins — required by default BT XML
    # (navigate_w_replanning_and_recovery.xml)
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.12    # PWM死区~0.15, 低于此算"已停止"
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.8  # 旋转死区
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3       # was 0.5, 更敏感检测停止
      movement_time_allowance: 2.0         # was 10.0 — 2秒无进展即触发replan

    general_goal_checker:
      stateful: false              # ★ 关键修复: 满足即到, 不要求连续稳定
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.8      # was 1.5(太松)→0.3(振荡)→0.5→0.8(46°)

    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: true
      min_vel_x: -0.25          # 允许全速倒退, 狭窄空间可倒车
      max_vel_x: 0.25             # was 0.4, 降速保安全
      max_vel_theta: 0.3         # was 1.5→1.0→0.3, 慢转防超调
      min_speed_xy: 0.0               # 不限制, 让DWB自己决定最低速
      max_speed_xy: 0.25
      min_speed_theta: 0.0            # 不限制
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      xy_goal_tolerance: 0.35       # 与 goal_checker 一致
      yaw_goal_tolerance: 0.8      # was 1.5(太松)→0.3(振荡)→0.5→0.8(46°)      # 与 goal_checker 一致
      transform_tolerance: 0.3
      shortest_path_orientation: true
      critics:
        - dwb_critics::RotateToGoal
        - dwb_critics::Oscillation
        - dwb_critics::BaseObstacle
        - dwb_critics::GoalAlign
        - dwb_critics::PathAlign
        - dwb_critics::PathDist
        - dwb_critics::GoalDist
      BaseObstacle.scale: 0.5              # 0.02(撞)→0.3(折中)→0.5(更强避障)
      PathAlign.scale: 8.0               # was 12, 降低让避障能压过路径跟随
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 12.0              # was 24→8→12
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 8.0                # was 12, 降低让避障优先级更高
      GoalDist.scale: 12.0               # was 24→8→12
      RotateToGoal.scale: 20.0           # 强旋转对准, 到了目标必须朝向对
      RotateToGoal.slowing_factor: 3.0
      RotateToGoal.lookahead_time: 2.0  # 提前2秒开始旋转对准, 避免到目标才转

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.15             # 实车轮距0.275m, 半对角线~0.22→取0.20留余量
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0     # 标准值
        inflation_radius: 0.15       # 0.3(原)→0.4(太怂)→0.25
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        observation_sources: scan detection
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.2
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
        detection:
          topic: /detection_obstacles
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          data_type: PointCloud2
          min_obstacle_range: 0.2
          max_obstacle_range: 3.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.2

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 5.0     # was 3.0, 更快响应动态障碍物
      publish_frequency: 2.0    # was 1.0
      rolling_window: false
      resolution: 0.05
      robot_radius: 0.20             # 与 local_costmap 一致
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.25       # was 0.1→0.25, 与local一致, A*正视障碍物
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.2
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0    # was 3.0, 更快重规划
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.15          # was 0.05, 放宽以应对狭窄卡死
      use_astar: true               # A* 启发式搜索, 比Dijkstra路径更优
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 2.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.25, 0.0, 2.5]
    min_velocity: [-0.25, 0.0, -2.5]
    max_accel: [0.5, 0.0, 3.2]
    max_decel: [-1.5, 0.0, -3.2]      # 紧急减速更狠
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]   # 不做死区过滤, 信任下位机
    velocity_timeout: 1.0

map_server:
  ros__parameters:
    yaml_filename: /app/src/robot_bringup/maps/map.yaml
