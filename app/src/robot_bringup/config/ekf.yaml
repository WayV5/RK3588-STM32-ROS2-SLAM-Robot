ekf_filter_node:
  ros__parameters:
    frequency: 125.0
    sensor_timeout: 0.1
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true
    publish_acceleration: false

    # ── /odom_raw (wheel encoders, 125Hz) ──────────────────
    # fuses vx (linear velocity x) and vyaw (angular velocity z)
    odom0: /odom_raw
    odom0_config:
      [false, false, false, false, false, false,
       true,  false, false, false, false, true,
       false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # ── /imu (MPU9250 via CAN, 200Hz effective) ────────────
    # fuses vyaw (angular velocity z) and ax (linear acceleration x)
    # gyro bias calibrated at STM32 startup (2026-06-20)
    imu0: /imu
    # IMU vyaw re-enabled — gyro z=0.00027 rad/s well-calibrated, provides
    # ground-truth angular velocity when wheels slip on floor (2026-06-20)
    imu0_config:
      [false, false, false, false, false, false,
       false, false, false, false, false, true,
       true,  false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true

    process_noise_covariance:
