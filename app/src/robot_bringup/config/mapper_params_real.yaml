slam_toolbox:
  ros__parameters:

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: true
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05

    min_laser_range: 0.2
    max_laser_range: 4.0     # 3m room, 4m for margin

    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    # Scan matching — conservative in small room (odo B=0.005 is good)
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.3    # was 0.15: fewer scans during rotation → less ghosting
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 4.0
    # Link match: tight, small room doesn't need long-range matching
    link_match_minimum_response_fine: 0.5
    link_scan_maximum_distance: 3.0   # room is ~3m, all useful points within range
    # Loop closure
    loop_search_maximum_distance: 2.0   # 3m room, smaller loop radius
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation search — tight window, odo is good (B=0.005), trust it
    correlation_search_space_dimension: 0.3   # 3m room, odo B=0.005, tight search
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 1.0    # was 0.5: trust odo more
    angle_variance_penalty: 3.0      # was 1.0: trust odo angle → reduce rotation ghosting
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    # Map quality: more conservative ray casting (2→3) for cleaner boundaries
    min_pass_through: 3
    occupancy_threshold: 0.2
